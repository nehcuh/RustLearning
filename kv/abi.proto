syntax = "proto3";

package abi;

message CommandRequest {
  oneof request_data {
    Hget hget = 1;
    Hmget hmget = 2;
    Hgetall hgetall = 3;
    Hset hset = 4;
    Hmset hmset = 5;
    Hdel hdel = 6;
    Hmdel hmdel = 7;
    Hexist hexist = 8;
    Hmexist hmexist = 9;
  }
}

message CommandResponse {
  uint32 status = 1;
  string message = 2;
  repeated Value values = 3;
  repeated KvPair pairs = 4;
}

message Value {
  oneof value {
    string string = 1;
    bytes binary = 2;
    int64 integer = 3;
    double float = 4;
    bool boolean = 5;
  }
}

message KvPair {
  string key = 1;
  Value value = 2;
}

message Hget {
  string table = 1;
  string key = 2;
}

message Hmget {
  string table = 1;
  repeated string keys = 2;
}

message Hgetall { string table = 1; }

message Hset {
  string table = 1;
  KvPair pair = 2;
}

message Hmset {
  string table = 1;
  repeated KvPair pairs = 2;
}

message Hdel {
  string table = 1;
  string key = 2;
}

message Hmdel {
  string table = 1;
  repeated string keys = 2;
}

message Hexist {
  string table = 1;
  string key = 2;
}

message Hmexist {
  string table = 1;
  repeated string keys = 2;
}
